name: doctor

# À lancer à la main (onglet Actions → doctor → Run workflow) : teste chaque source depuis GitHub
# et affiche combien d'offres / de stages / d'offres pertinentes elle remonte.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Ne tester que les sources dont le nom contient… (vide = toutes)"
        required: false
        default: ""

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: radar doctor
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FRANCETRAVAIL_CLIENT_ID: ${{ secrets.FRANCETRAVAIL_CLIENT_ID }}
          FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}
          INPUT_ONLY: ${{ github.event.inputs.only }}
        run: |
          python -m radar doctor --only "$INPUT_ONLY" --json doctor.json | tee doctor.txt || true
          { echo '### radar doctor'; echo '```'; cat doctor.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: |
            doctor.txt
            doctor.json
