[project]
name = "internship-radar"
version = "1.0.0"
description = "Alertes de stages finance (Paris / Genève) sur Telegram et Discord"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "beautifulsoup4>=4.12", "defusedxml>=0.7"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
