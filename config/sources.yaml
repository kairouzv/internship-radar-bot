# ─────────────────────────────────────────────────────────────────────────────────────────────
#  SOURCES SURVEILLÉES
#
#  Le bot interroge toutes ces sources en parallèle à chaque passage (~10 min).
#  • type: auto  → tu donnes la page carrières, le bot détecte tout seul l'ATS (Workday, Greenhouse, Lever…).
#  • Pour désactiver une source : enabled: false.   Pour la tester seule : radar doctor --only NOM
#  • « radar doctor » dit en 1 minute quelles sources répondent vraiment depuis ta machine / GitHub.
#  • Une source en échec n'empêche jamais les autres de tourner.
#
#  ⚠️ Les URLs de pages carrières ci-dessous sont des points de départ : certaines changent ou sont
#     rendues en JavaScript. Lance « radar doctor », puis corrige/désactive celles qui sont en FAIL
#     (voir le README, section « Ajouter une entreprise »).
# ─────────────────────────────────────────────────────────────────────────────────────────────
sources:

  # ══ 1. ALERTES E-MAIL (couverture LinkedIn, Indeed, Welcome to the Jungle, eFinancialCareers, jobs.ch…) ══
  # Le plus puissant : les job boards t'envoient eux-mêmes les offres. Voir README « Alertes e-mail ».
  - name: Alertes-mail
    type: email
    folder: JobAlerts            # libellé Gmail qui reçoit tes alertes
    days: 3
    trust_internship: true       # tes alertes sont déjà filtrées « stage » côté site
    every_minutes: 10

  # ══ 2. APIs GRATUITES D'AGRÉGATEURS (clés à créer, voir README) ═══════════════════════════════════
  - name: Adzuna-Paris
    type: adzuna
    country: fr
    where: Paris
    search: ["stage m&a", "stage corporate finance", "stage private equity", "stage leveraged finance",
             "stage investment banking", "stage financement d'acquisition"]
    days: 3
    every_minutes: 60
  - name: Adzuna-Geneve
    type: adzuna
    country: ch
    where: Genève
    search: ["stage finance", "internship investment banking", "internship private equity", "stage corporate finance"]
    days: 3
    every_minutes: 60
  - name: FranceTravail
    type: francetravail
    search: ["stage m&a", "stage corporate finance", "stage private equity", "stage financement"]
    departements: ["75", "92"]
    days: 3
    every_minutes: 60

  # ══ 3. ATS CONNUS (config directe, la plus fiable quand elle est juste) ══════════════════════════
  - name: JPMorgan
    type: oracle_hcm
    host: jpmc.fa.oraclecloud.com
    site: CX_1001
    search: ["intern", "internship", "stage", "summer analyst"]
    verified: false              # à confirmer avec « radar doctor --only JPMorgan »
  - name: Citi
    type: workday
    host: citi.wd5.myworkdayjobs.com
    site: "2"
    search: ["intern", "internship", "stage"]
    verified: false

  # ══ 4. BANQUES & BOUTIQUES M&A / COVERAGE (détection automatique de l'ATS) ═══════════════════════
  - {name: Rothschild-Co,   type: auto, url: "https://www.rothschildandco.com/en/careers/"}
  - {name: Lazard,          type: auto, url: "https://www.lazard.com/careers/"}
